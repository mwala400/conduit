name: Build Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test signaling and direct invitations
        run: npm run test:sharing

      - name: Build web app and sync Android
        run: |
          npm run build
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build universal Android APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Prepare release assets
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Conduit-Android-debug.apk
          zip -qr Conduit-Web-Server.zip dist server package.json package-lock.json README.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Conduit-Android-debug.apk \
            Conduit-Web-Server.zip \
            --title "Conduit $GITHUB_REF_NAME" \
            --generate-notes || gh release upload "$GITHUB_REF_NAME" Conduit-Android-debug.apk Conduit-Web-Server.zip --clobber
